name: status page

# Tests the runner, checks the queue, and publishes the status page: on every push (each run
# pushes its progress), once a day, and by hand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The runner's own tests
        run: node --test "tests/**/*.test.mjs"
      - name: The queue is well formed
        run: node tools/titan.mjs validate
      - name: Build the status page
        run: node tools/titan.mjs render --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
